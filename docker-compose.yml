services:
  db:
    image: mysql:8.0
    container_name: ai_listing_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_listing}
      MYSQL_USER: ${MYSQL_USER:-ai_listing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ai_listing_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_listing_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ai_listing}
      DB_USER: ${MYSQL_USER:-ai_listing}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_db}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
      SERVE_MEDIA: ${SERVE_MEDIA:-false}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-true}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8000}
      NANO_BANANA_MEDIA_PUBLIC_BASE: ${NANO_BANANA_MEDIA_PUBLIC_BASE:-http://localhost:8000/media}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - staticfiles_data:/app/staticfiles
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ai_listing/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-ai_listing}
      DB_USER: ${MYSQL_USER:-ai_listing}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_WORKER_QUEUES: ${CELERY_WORKER_QUEUES:-image_gen_high,image_gen}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-10}
    command:
      [
        "sh",
        "-c",
        "celery -A ai_listing_project worker -Q $${CELERY_WORKER_QUEUES:-image_gen_high,image_gen} -c $${CELERY_WORKER_CONCURRENCY:-10} --loglevel=info",
      ]
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 10G
    healthcheck:
      test: ["CMD-SHELL", "celery -A ai_listing_project inspect ping --timeout 5 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  flower:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command:
      [
        "celery",
        "-A",
        "ai_listing_project",
        "flower",
        "--port=5555",
        "--broker_api=${CELERY_BROKER_URL:-redis://redis:6379/0}",
      ]
    ports:
      - "${FLOWER_PORT:-5555}:5555"

  nginx:
    image: nginx:1.27-alpine
    container_name: ai_listing_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  mysql_data:
  media_data:
  staticfiles_data:
