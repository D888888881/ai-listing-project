{% extends 'base.html' %}
{% block title %}注册 - ASIN Lens{% endblock %}

{% block content %}
  <div class="apple-card" style="max-width: 560px; margin: 250px auto; padding: 28px 32px;">
    <h2 class="card-title" style="margin: 34px 160px">📊 AI Listing</h2>
    <div style="margin-bottom: 12px; color:#667085;">注册后需要超级管理员审批通过才能登录。</div>

    {% if form.errors %}
      <div style="margin: 8px 0 14px; padding:10px 12px;border-radius:12px;background:#fef3f2;border:1px solid #ffd5d2;color:#912018;">
        {{ form.errors }}
      </div>
    {% endif %}

    <form method="post" action="{% url 'register' %}">
      {% csrf_token %}
      <div class="field-group">
        <div class="field-label">用户名</div>
        <input type="text" name="username" required value="{{ request.POST.username|default:'' }}"
               style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e8e8ed;background:#fff;">
      </div>
      <div class="field-group">
        <div class="field-label">邮箱</div>
        <input type="email" name="email" required value="{{ request.POST.email|default:'' }}"
               style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e8e8ed;background:#fff;">
      </div>
      <div class="field-group">
        <div class="field-label">密码</div>
        <input type="password" name="password1" required
               style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e8e8ed;background:#fff;">
      </div>
      <div class="field-group">
        <div class="field-label">确认密码</div>
        <input type="password" name="password2" required
               style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #e8e8ed;background:#fff;">
      </div>
      <div class="field-group">
        <div class="field-label">验证码</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <img src="{% url 'captcha_image' %}?r={{ captcha_nonce }}" alt="验证码" id="register-captcha-img"
               style="height:48px;border-radius:8px;border:1px solid #e8e8ed;cursor:pointer;background:#f9fafb;"
               title="点击刷新验证码">
          <input type="text" name="captcha" maxlength="8" required autocomplete="off" inputmode="text"
                 placeholder="图中字符（不区分大小写）"
                 style="flex:1;min-width:140px;padding:12px 14px;border-radius:12px;border:1px solid #e8e8ed;background:#fff;">
        </div>
        <div style="margin-top:6px;font-size:0.8rem;color:#667085;"></div>
      </div>
      <button type="submit"
              style="width:100%;background:#0071e3;color:#fff;border:none;padding:12px 14px;border-radius:12px;font-weight:600;cursor:pointer;">
        提交注册
      </button>
    </form>

    <div style="margin-top: 12px; color:#667085; font-size:0.9rem;">
      已有账号？<a href="{% url 'login' %}" style="color:#0071e3;text-decoration:none;">去登录</a>
    </div>
  </div>
  <script>
    (function () {
      var img = document.getElementById('register-captcha-img');
      if (!img) return;
      var base = "{% url 'captcha_image' %}";
      img.addEventListener('click', function () {
        img.src = base + '?r=' + Date.now();
      });
    })();
  </script>
{% endblock %}
